<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetConecta – Meu Pet</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/estilo.css"></head>
<body><header id="topo"></header><main>
<div class="card barra"><label>Meu pet<select id="selPet"></select></label><span id="estado" class="badge" role="status"></span></div>
<div class="duas"><div class="card"><div id="mapa"></div></div><div class="col">
<div class="card"><h2>Situação</h2><dl id="metricas"></dl><div id="chegar"></div></div>
<div class="card"><h2>Simulador GPS (fictício)</h2><div class="btns"><button id="bIniciar" class="btn">Iniciar simulação</button><button id="bFuga" class="btn pe">Simular fuga</button><button id="bVolta" class="btn sec">Fazer voltar</button><button id="bCasa" class="btn sec">Reiniciar em casa</button></div>
<label>Raio de segurança: <output id="oRaio"></output><input id="raio" type="range" min="50" max="1000" step="25"></label><label>Velocidade da simulação<select id="vel"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option></select></label></div></div></div>
<div class="card"><h2>Histórico demonstrativo</h2><ul id="hist" class="l"></ul><p><button id="bLimpar" class="btn sec">Limpar histórico</button></p></div>
</main><footer></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/servicos/armazenamento.js"></script><script src="js/servicos/dados-service.js"></script><script src="js/servicos/pet-service.js"></script><script src="js/nucleo/regras.js"></script><script src="js/ui/layout.js"></script><script src="js/gps/simulador-gps.js"></script><script src="js/ui/mapa.js"></script><script src="js/paginas/meu-pet.js"></script>
</body></html>
